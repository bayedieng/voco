[package]
name = "vocod"
version = "0.1.0"
edition = "2024"

[dependencies]
enigo = { version = "0.6.1", features = ["wayland"] }
ort = "2.0.0-rc.13"
hound = "3.5.1"
realfft = "3.5.0"
rubato = "0.16.2"
cpal = "0.16.0"
rtrb = "0.3.2"
ctrlc = "3.4.7"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
sha2 = "0.10.9"
bzip2 = "0.6.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
tar = "0.4.46"
